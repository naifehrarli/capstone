<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t["app_name"] }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand" href="/">{{ t["app_name"] }}</a>

        <div class="dropdown">
            <button class="btn btn-outline-light btn-sm no-arrow" type="button" data-bs-toggle="dropdown">
                &vellip;
            </button>

            <ul class="dropdown-menu dropdown-menu-end shadow">
                <li><a class="dropdown-item" href="/set-language/en">🇬🇧 {{ t["english"] }}</a></li>
                <li><a class="dropdown-item" href="/set-language/tr">🇹🇷 {{ t["turkish"] }}</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow-sm">
                <div class="card-body p-5 text-center">

                    <h1 class="mb-3">{{ t["app_name"] }}</h1>

                    <p class="text-muted mb-4">
                        {{ t["landing_description"] }}
                    </p>

                    <a href="/register" class="btn btn-primary btn-lg me-2">
                        {{ t["register_new_user"] }}
                    </a>

                    <a href="/login" class="btn btn-outline-secondary btn-lg">
                        {{ t["login"] }}
                    </a>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
