<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <title>{{ t["edit_profile"] }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand" href="/dashboard">{{ t["app_name"] }}</a>
        <a href="/profile/{{ user['id'] }}" class="btn btn-outline-light btn-sm">{{ t["back_to_profile"] }}</a>
    </div>
</nav>

<div class="container py-5">
    <div class="card shadow p-4">
        <h2 class="mb-4">{{ t["edit_profile"] }}</h2>
        <div class="text-center mb-4">

    {% if user['profile_picture'] %}
        <img src="{{ url_for('static', filename=user['profile_picture']) }}"
             class="rounded-circle mb-3"
             style="width:150px;height:150px;object-fit:cover;">
    {% else %}
        <div class="profile-avatar mx-auto">
            {{ user['name'][0]|upper }}
        </div>
    {% endif %}

    

</div>

       <form method="POST" enctype="multipart/form-data">

        <div class="mt-3">
        <label class="form-label fw-bold">Profile Picture</label>
        <input type="file"
               name="profile_picture"
               class="form-control"
               accept=".jpg,.jpeg,.png">
    </div>
    
            <div class="row g-3">

                <div class="col-md-6">
                    <label class="form-label">{{ t["name"] }}</label>
                    <input type="text" name="name" class="form-control" value="{{ user['name'] }}" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">{{ t["academic_rank"] }}</label>
                    <select name="rank" class="form-select" required>
                        <option {% if user['rank'] == 'Research Assistant' %}selected{% endif %}>Research Assistant</option>
                        <option {% if user['rank'] == 'Lecturer' %}selected{% endif %}>Lecturer</option>
                        <option {% if user['rank'] == 'Assistant Professor' %}selected{% endif %}>Assistant Professor</option>
                        <option {% if user['rank'] == 'Associate Professor' %}selected{% endif %}>Associate Professor</option>
                        <option {% if user['rank'] == 'Professor' %}selected{% endif %}>Professor</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">{{ t["current_city"] }}</label>
                    <select name="current_city" id="current_city" class="form-select" onchange="updateUniversities('current')" required>
                        <option {% if user['current_city'] == 'Istanbul' %}selected{% endif %}>Istanbul</option>
                        <option {% if user['current_city'] == 'Ankara' %}selected{% endif %}>Ankara</option>
                        <option {% if user['current_city'] == 'Izmir' %}selected{% endif %}>Izmir</option>
                        <option {% if user['current_city'] == 'Bursa' %}selected{% endif %}>Bursa</option>
                        <option {% if user['current_city'] == 'Antalya' %}selected{% endif %}>Antalya</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">{{ t["current_university"] }}</label>
                    <select name="current_university" id="current_university" class="form-select" required></select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">{{ t["faculty"] }}</label>
                    <select name="current_faculty" id="current_faculty" class="form-select" onchange="updateDepartments('current')" required>
                        <option {% if user['current_faculty'] == 'Engineering' %}selected{% endif %}>Engineering</option>
                        <option {% if user['current_faculty'] == 'Medicine' %}selected{% endif %}>Medicine</option>
                        <option {% if user['current_faculty'] == 'Law' %}selected{% endif %}>Law</option>
                        <option {% if user['current_faculty'] == 'Education' %}selected{% endif %}>Education</option>
                        <option {% if user['current_faculty'] == 'Arts and Sciences' %}selected{% endif %}>Arts and Sciences</option>
                        <option {% if user['current_faculty'] == 'Economics and Administrative Sciences' %}selected{% endif %}>Economics and Administrative Sciences</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">{{ t["department"] }}</label>
                    <select name="department" id="current_department" class="form-select" required></select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">{{ t["preferred_city"] }}</label>
                    <select name="preferred_city" id="preferred_city" class="form-select" onchange="updateUniversities('preferred')" required>
                        <option {% if user['preferred_city'] == 'Istanbul' %}selected{% endif %}>Istanbul</option>
                        <option {% if user['preferred_city'] == 'Ankara' %}selected{% endif %}>Ankara</option>
                        <option {% if user['preferred_city'] == 'Izmir' %}selected{% endif %}>Izmir</option>
                        <option {% if user['preferred_city'] == 'Bursa' %}selected{% endif %}>Bursa</option>
                        <option {% if user['preferred_city'] == 'Antalya' %}selected{% endif %}>Antalya</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">{{ t["preferred_university"] }}</label>
                    <select name="preferred_university" id="preferred_university" class="form-select" required></select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">{{ t["preferred_faculty"] }}</label>
                    <select name="preferred_faculty" id="preferred_faculty" class="form-select" onchange="updateDepartments('preferred')" required>
                        <option {% if user['preferred_faculty'] == 'Engineering' %}selected{% endif %}>Engineering</option>
                        <option {% if user['preferred_faculty'] == 'Medicine' %}selected{% endif %}>Medicine</option>
                        <option {% if user['preferred_faculty'] == 'Law' %}selected{% endif %}>Law</option>
                        <option {% if user['preferred_faculty'] == 'Education' %}selected{% endif %}>Education</option>
                        <option {% if user['preferred_faculty'] == 'Arts and Sciences' %}selected{% endif %}>Arts and Sciences</option>
                        <option {% if user['preferred_faculty'] == 'Economics and Administrative Sciences' %}selected{% endif %}>Economics and Administrative Sciences</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">{{ t["preferred_department"] }}</label>
                    <select name="preferred_department" id="preferred_department" class="form-select" required></select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">{{ t["teaching_language"] }}</label>
                    <select name="teaching_language" class="form-select" required>
                        <option value="English" {% if user['teaching_language'] == 'English' %}selected{% endif %}>English</option>
                        <option value="Turkish" {% if user['teaching_language'] == 'Turkish' %}selected{% endif %}>Turkish</option>
                        <option value="English and Turkish" {% if user['teaching_language'] == 'English and Turkish' %}selected{% endif %}>English and Turkish</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">{{ t["teaching_mode"] }}</label>
                    <select name="teaching_mode" class="form-select" required>
                        <option value="Face-to-face" {% if user['teaching_mode'] == 'Face-to-face' %}selected{% endif %}>Face-to-face</option>
                        <option value="Hybrid" {% if user['teaching_mode'] == 'Hybrid' %}selected{% endif %}>Hybrid</option>
                    </select>
                </div>

            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">
                <a href="/profile/{{ user['id'] }}" class="btn btn-outline-primary">{{ t["cancel"] }}</a>
                <button type="submit" class="btn btn-primary">{{ t["save_changes"] }}</button>
            </div>
        </form>
    </div>
</div>

<script>
const universitiesByCity = {
    Istanbul: [
        "Istanbul University",
        "Istanbul Technical University",
        "Boğaziçi University",
        "Marmara University",
        "Yıldız Technical University",
        "Koç University",
        "Sabancı University",
        "Bahçeşehir University",
        "Üsküdar University",
        "Istanbul Medipol University",
        "Istanbul Bilgi University",
        "Istanbul Aydın University",
        "Istanbul Kültür University",
        "Galatasaray University",
        "Mimar Sinan Fine Arts University"
    ],
    Ankara: [
        "Ankara University",
        "Middle East Technical University",
        "Hacettepe University",
        "Gazi University",
        "Bilkent University",
        "TOBB University of Economics and Technology",
        "Başkent University",
        "Çankaya University",
        "Atılım University",
        "TED University"
    ],
    Izmir: [
        "Ege University",
        "Dokuz Eylül University",
        "Izmir Institute of Technology",
        "Izmir University of Economics",
        "Yaşar University"
    ],
    Bursa: [
        "Bursa Uludağ University",
        "Bursa Technical University"
    ],
    Antalya: [
        "Akdeniz University",
        "Antalya Bilim University"
    ]
};

const departmentsByFaculty = {
    Engineering: [
        "Computer Engineering",
        "Software Engineering",
        "Electrical and Electronics Engineering",
        "Mechanical Engineering",
        "Civil Engineering",
        "Industrial Engineering",
        "Chemical Engineering",
        "Environmental Engineering",
        "Mechatronics Engineering",
        "Biomedical Engineering"
    ],
    Medicine: [
        "Medicine",
        "Surgery",
        "Internal Medicine",
        "Pediatrics",
        "Public Health",
        "Anatomy",
        "Cardiology",
        "Neurology"
    ],
    Law: [
        "Public Law",
        "Private Law",
        "International Law",
        "Criminal Law",
        "Commercial Law",
        "Constitutional Law"
    ],
    Education: [
        "Primary Education",
        "Mathematics Education",
        "Science Education",
        "English Language Teaching",
        "Guidance and Psychological Counseling",
        "Preschool Education"
    ],
    "Arts and Sciences": [
        "Psychology",
        "Sociology",
        "Mathematics",
        "Physics",
        "Chemistry",
        "History",
        "Turkish Language and Literature",
        "Molecular Biology and Genetics"
    ],
    "Economics and Administrative Sciences": [
        "Business Administration",
        "Economics",
        "International Relations",
        "Political Science and Public Administration",
        "Finance",
        "Management Information Systems",
        "International Trade"
    ]
};

function updateUniversities(type, selectedValue = "") {
    const city = document.getElementById(type + "_city").value;
    const select = document.getElementById(type + "_university");

    select.innerHTML = "";

    (universitiesByCity[city] || []).forEach(university => {
        let option = document.createElement("option");
        option.value = university;
        option.textContent = university;

        if (university === selectedValue) {
            option.selected = true;
        }

        select.appendChild(option);
    });
}

function updateDepartments(type, selectedValue = "") {
    const faculty = document.getElementById(type + "_faculty").value;
    const select = document.getElementById(type + "_department");

    select.innerHTML = "";

    (departmentsByFaculty[faculty] || []).forEach(department => {
        let option = document.createElement("option");
        option.value = department;
        option.textContent = department;

        if (department === selectedValue) {
            option.selected = true;
        }

        select.appendChild(option);
    });
}

updateUniversities("current", "{{ user['current_university'] }}");
updateUniversities("preferred", "{{ user['preferred_university'] }}");
updateDepartments("current", "{{ user['department'] }}");
updateDepartments("preferred", "{{ user['preferred_department'] }}");
</script>

</body>
</html>
