<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Academic Permutation System</a>
        <a href="/" class="btn btn-outline-light btn-sm">Home</a>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h2 class="text-center mb-2">Login</h2>

                    <p class="text-muted text-center mb-4">
                        Enter your registered university email and password.
                    </p>

                    {% if error %}
                    <div class="alert alert-danger">
                        {{ error }}
                    </div>
                    {% endif %}

                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">University Email</label>
                            <input type="email" name="email" class="form-control" placeholder="example@university.edu.tr" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <div class="password-field">
                                <input type="password" name="password" id="login_password" class="form-control" placeholder="Enter your password" required>
                                <button type="button" class="password-toggle" aria-label="Show password" onclick="togglePassword('login_password', this)">
                                    <i class="fa-regular fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Login
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <a href="/register">New user? Register here</a>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<script>
function togglePassword(inputId, button) {
    const input = document.getElementById(inputId);
    const icon = button.querySelector("i");
    const showPassword = input.type === "password";

    input.type = showPassword ? "text" : "password";
    icon.classList.toggle("fa-eye", !showPassword);
    icon.classList.toggle("fa-eye-slash", showPassword);
    button.setAttribute("aria-label", showPassword ? "Hide password" : "Show password");
}
</script>

</body>
</html>
