<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t["login"] }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand" href="/">{{ t["app_name"] }}</a>

        <div class="d-flex align-items-center gap-2">
            <a href="/" class="btn btn-outline-light btn-sm">{{ t["home"] }}</a>

            <div class="dropdown">
                <button class="btn btn-outline-light btn-sm no-arrow" type="button" data-bs-toggle="dropdown">
                    &vellip;
                </button>

                <ul class="dropdown-menu dropdown-menu-end shadow">
                    <li><a class="dropdown-item" href="/set-language/en">🇬🇧 {{ t["english"] }}</a></li>
                    <li><a class="dropdown-item" href="/set-language/tr">🇹🇷 {{ t["turkish"] }}</a></li>
                </ul>
            </div>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h2 class="text-center mb-2">{{ t["login"] }}</h2>

                    <p class="text-muted text-center mb-4">
                        {{ t["login_description"] }}
                    </p>

                    {% if error %}
                    <div class="alert alert-danger">
                        {{ error }}
                    </div>
                    {% endif %}

                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">{{ t["university_email"] }}</label>
                            <input type="email" name="email" class="form-control" placeholder="example@university.edu.tr" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">{{ t["password"] }}</label>
                            <div class="password-field">
                                <input type="password" name="password" id="login_password" class="form-control" placeholder="{{ t["enter_password"] }}" required>
                                <button type="button" class="password-toggle" aria-label="{{ t["show_password"] }}" data-show-label="{{ t["show_password"] }}" data-hide-label="{{ t["hide_password"] }}" onclick="togglePassword('login_password', this)">
                                    <i class="fa-regular fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            {{ t["login"] }}
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <a href="/register">{{ t["new_user_register_here"] }}</a>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
function togglePassword(inputId, button) {
    const input = document.getElementById(inputId);
    const icon = button.querySelector("i");
    const showPassword = input.type === "password";

    input.type = showPassword ? "text" : "password";
    icon.classList.toggle("fa-eye", !showPassword);
    icon.classList.toggle("fa-eye-slash", showPassword);
    button.setAttribute("aria-label", showPassword ? button.dataset.hideLabel : button.dataset.showLabel);
}
</script>

</body>
</html>
